name: wan-only-release-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned release tooling
        run: |
          python -m pip install \
            -c constraints/release.txt \
            'build>=1.2' 'setuptools>=77,<81' 'twine>=6' 'wheel>=0.46,<0.47'
      - name: Build and validate Wan-only artifacts
        run: |
          python tools/release/build_artifacts.py \
            --out-dir "${RUNNER_TEMP}/teleboost-release-wan"
      - name: Confirm the checkout stayed clean
        run: git diff --exit-code
